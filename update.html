<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom Autofill · Update</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body{width:auto;max-width:560px;margin:32px auto;padding:0 16px}
    h1{font-size:20px;margin:0 0 4px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
    .card p{margin:4px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
    pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:56px;font-size:12px}
  </style>
</head>
<body>
  <h1>Update Custom Autofill</h1>
  <p class="hint">Pulls the latest files from your GitHub repo into your extension folder, then reloads the extension.</p>

  <div class="card">
    <p><b>Repository:</b> <span id="repo"></span></p>
    <p><b>Version:</b> <span id="ver"></span></p>
  </div>

  <div class="card">
    <p><b>1. Extension folder</b></p>
    <p class="hint">Choose the same folder you used for “Load unpacked”. You only do this once.</p>
    <p id="folder"></p>
    <div class="row">
      <button id="pick" class="ghost">Choose folder…</button>
      <button id="grant" class="ghost">Allow write access</button>
    </div>
    <p id="perm" class="hint"></p>
  </div>

  <div class="card">
    <p><b>2. Update</b></p>
    <div class="row">
      <button id="update" class="primary">Check &amp; update now</button>
      <button id="force" class="ghost">Reinstall current version</button>
    </div>
  </div>

  <pre id="log"></pre>
  <script src="updater.js"></script>
  <script src="update.js"></script>
</body>
</html>
